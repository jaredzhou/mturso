# mturso CI — check / fmt / test on every push and PR.
# 参考 jaredzhou/moonpg 的 ci.yml；差异是本库依赖 Turso 的 C 动态库，链接路径要按检出目录重写。

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # 仓库里的 moon.pkg 是开发者本机的绝对路径，runner 上要改成检出目录。
      # 库（libs/libturso_sync_sdk_kit.so）本身在版本库里，这里只重写链接参数。
      - name: Point link flags at this checkout
        run: bash scripts/fetch-turso-lib.sh --rewrite-only

      # Type-check with warnings as errors.
      - name: Check
        run: moon check --target native --deny-warn

      # Format check.
      - name: Format check
        run: moon fmt --check

      # Build and run all tests.
      - name: Test
        run: moon test --target native --deny-warn
