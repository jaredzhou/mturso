# mturso CI — check / fmt / test on Linux and macOS, every push and PR.
# 参考 jaredzhou/moonpg 的 ci.yml；差异是本库依赖 Turso 的 C 动态库：
#   Linux：库随仓库分发（libs/），只需把 moon.pkg 里的绝对路径改成检出目录；
#   macOS：平台库不在仓库里，按架构现取 .dylib，再让脚本复制 + 重写链接参数。

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # 仓库里的 moon.pkg 是开发者本机的绝对路径，runner 上要改成检出目录。
      - name: Point link flags at this checkout (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-turso-lib.sh --rewrite-only

      # macOS 需要本平台的 .dylib（darwin_amd64 / darwin_arm64）：从 Go module proxy 取，
      # 再交给脚本 —— 复制到 libs/ 并重写两处 cc-link-flags。
      - name: Fetch the Turso dylib and point link flags at this checkout (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://proxy.golang.org/github.com/tursodatabase/turso-go-platform-libs/@v/v0.8.2.zip" -o "$tmp/libs.zip"
          unzip -q "$tmp/libs.zip" -d "$tmp"
          case "$(uname -m)" in
            arm64) sub=darwin_arm64 ;;
            *)     sub=darwin_amd64 ;;
          esac
          src="$tmp/github.com/tursodatabase/turso-go-platform-libs@v0.8.2/libs/$sub/libturso_sync_sdk_kit.dylib"
          TURSO_LIB_SRC="$src" bash scripts/fetch-turso-lib.sh

      # Type-check with warnings as errors.
      - name: Check
        run: moon check --target native --deny-warn

      # Format check（软检查）。
      #
      # 为什么是 --warn 而不是 --check：CI 装的是最新工具链（本文写时 0.1.20261012），
      # 它在默认目标（wasm-gc）下会把源码里的 `Int` 规范成 `Int32`；而 0.1.20260920
      # 及更早的工具链**不认识 `Int32`**（`The type Int32 is undefined.`）。
      # 两边无法同时满足，所以在开发用工具链升到 ≥0.1.20261012 之前先软检查：
      # 仍然打印差异，但不让 CI 变红。
      - name: Format check (soft; see comment)
        run: moon fmt --warn

      # Build and run all tests.
      - name: Test
        run: moon test --target native --deny-warn
