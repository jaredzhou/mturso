# mturso CI — check / fmt / test on Linux, macOS, and Windows every push and PR.
# 参考 jaredzhou/moonpg 的 ci.yml；差异是本库依赖 Turso 的 C 动态库：
#   仓库随包提供 linux/x86_64 的 .so 和 windows/x64 的 .dll；
#   其它平台/架构（macOS 两种、linux arm64）按 runner 的 uname 现取对应平台库。

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux x86_64
          - ubuntu-24.04-arm # linux arm64
          - macos-latest # macOS arm64（M 系列）
          # 没有 macOS x86_64（Intel）这一条：MoonBit 不发布 darwin-x86_64 工具链
          # （安装脚本直接报 `Unsupported platform: Darwin x86_64`，
          #  且 binaries/latest/moonbit-darwin-x86_64.tar.gz 是 403）。
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # 其它平台/架构：从 Go module proxy 取对应平台的库，交给同一个脚本
      # 复制进 libs/。仓库自带的 linux/x86_64 库直接在运行期加载。
      - name: Fetch the Turso library for this platform
        if: runner.os == 'macOS' || runner.arch == 'ARM64'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://proxy.golang.org/github.com/tursodatabase/turso-go-platform-libs/@v/v0.8.2.zip" -o "$tmp/libs.zip"
          unzip -q "$tmp/libs.zip" -d "$tmp"
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64)  sub=darwin_arm64; lib=libturso_sync_sdk_kit.dylib ;;
            Darwin/x86_64) sub=darwin_amd64; lib=libturso_sync_sdk_kit.dylib ;;
            Linux/aarch64) sub=linux_arm64;  lib=libturso_sync_sdk_kit.so ;;
            *) echo "unsupported runner: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          src="$tmp/github.com/tursodatabase/turso-go-platform-libs@v0.8.2/libs/$sub/$lib"
          TURSO_LIB_SRC="$src" bash scripts/fetch-turso-lib.sh

      - name: Fetch pinned tursodb for lifecycle tests
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tursodb-v0.8.2"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/tursodatabase/turso/releases/download/v0.8.2/turso_cli-x86_64-unknown-linux-gnu.tar.xz" |
            tar -xJ -C "$dir"
          bin="$(find "$dir" -type f -name tursodb -perm -u+x | head -n1)"
          test -n "$bin"
          "$bin" --version | grep -F "0.8.2"
          echo "TURSODB=$bin" >> "$GITHUB_ENV"

      # Type-check with warnings as errors.
      - name: Check
        run: moon check --target native --deny-warn

      # Format check（软检查）。
      #
      # 我们的源码刻意写 `Int`（`Int` 与 `Int32` 是同一个类型，`moon info` 也只打印 `Int`），
      # 但 0.1.20261012 的 formatter 会无条件把它重写成 `Int32`，moonfmt 又没有开关可以关掉；
      # 更早的工具链则完全不认识 `Int32` 这个名字。既然改名字不是我们要的，这里用 --warn：
      # 差异仍然打在日志里，但不因为一个拼法偏好把 CI 弄红。
      # 注意：不要在这些文件上直接跑 `moon fmt`，它会把 `Int` 改成 `Int32`。
      - name: Format check (soft, see comment)
        run: moon fmt --warn

      - name: Build native pipeline server
        run: |
          moon build cmd/native-server --target native
          echo "MTURSO_NATIVE_SERVER=$PWD/_build/native/debug/build/cmd/native-server/native-server" >> "$GITHUB_ENV"

      # Build and run all tests.
      - name: Test
        run: moon test --target native --deny-warn

  windows:
    name: Windows x64
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Update dependencies
        shell: pwsh
        run: |
          moon version --all
          moon update

      - name: Fetch pinned tursodb for lifecycle tests
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tursodb-v0.8.2"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $archive = Join-Path $dir "turso_cli.zip"
          curl.exe -fsSL "https://github.com/tursodatabase/turso/releases/download/v0.8.2/turso_cli-x86_64-pc-windows-msvc.zip" -o $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
          $bin = Get-ChildItem -LiteralPath $dir -Recurse -Filter "tursodb.exe" | Select-Object -First 1
          if (-not $bin) { throw "tursodb.exe not found" }
          $version = (& $bin.FullName --version | Out-String)
          if ($version -notmatch "0\.8\.2") { throw "unexpected tursodb version: $version" }
          "TURSODB=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check
        shell: pwsh
        run: moon check --target native --deny-warn

      - name: Build native pipeline server
        shell: pwsh
        run: |
          moon build cmd/native-server --target native
          $exe = Join-Path $PWD "_build/native/debug/build/cmd/native-server/native-server.exe"
          "MTURSO_NATIVE_SERVER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        shell: pwsh
        run: moon test --target native --deny-warn
